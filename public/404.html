<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  :root { color-scheme: light dark; --bg: #EEE8F6; --ink: #2A2145; --accent: #4A35B0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171128; --ink: #F1ECFA; --accent: #C9BDFF; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; text-align: center; }
  h1 { margin: 0 0 8px; font-family: "Caveat", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; font-size: 3rem; font-weight: 700; }
  p { margin: 0 0 24px; font-size: 1.1rem; line-height: 1.5; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Lost in the room?</h1>
  <p>That page doesn't exist, but the rest of the workspace is right where you left it.</p>
  <a href="/">Back to the home page</a>
</main>
</body>
</html>
